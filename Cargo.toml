[workspace]
resolver = "3"
members = ["crates/opennotebook_ai", "crates/opennotebook_api", "crates/opennotebook_build", "crates/opennotebook_memory", "crates/opennotebook_convert", "crates/opennotebook_ingest", "crates/opennotebook_script", "crates/opennotebook_sdk", "crates/opennotebook_server", "crates/opennotebook_session", "crates/opennotebook_speech", "crates/opennotebook_vad"]
# A wasm crate cannot share a target dir with the native ones, so the Dioxus app
# carries its own [workspace] and `dx` builds it. `cargo build --workspace` here
# touches only the native crates.
exclude = ["crates/opennotebook_ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
authors = ["OpenNotebook contributors"]
license = "MIT"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdf_oxide = "0.3.78"
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.41", features = ["serialize"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "signal", "net", "sync", "fs", "io-util"] }
async-trait = "0.1"
axum = "0.8"
futures-util = "0.3"
tokio-stream = "0.1"
anyhow = "1"
base64 = "0.22"
async-stream = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
dirs = "7"
toml = "1"
tempfile = "3"
libc = "0.2"


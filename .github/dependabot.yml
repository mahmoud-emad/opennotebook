# Weekly dependency updates, grouped so each ecosystem is one pull request.
version: 2
updates:
  - package-ecosystem: uv
    directory: /server
    schedule:
      interval: weekly
    groups:
      server:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint does not support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    ignore:
      # Node moves with CI and the README, LTS releases only, by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      images:
        patterns: ["*"]

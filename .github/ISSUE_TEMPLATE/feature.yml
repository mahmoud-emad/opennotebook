name: Feature request
description: An idea for something new, or a better way to do something.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem first; a solution is welcome but optional.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?

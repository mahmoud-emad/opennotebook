# CodeQL's security analysis of the server (Python), the web app
# (TypeScript) and these workflows, on every push to main, every pull
# request, and weekly for newly found query patterns. Findings appear under
# Security > Code scanning.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7.0.1
      # Python and TypeScript are read from the source; nothing is built.
      - uses: github/codeql-action/init@v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4.38.2
        with:
          category: /language:${{ matrix.language }}

# The checks `make check` runs, on every push to main and every pull request:
# the server (format, lint, types, migrations, the API contract, tests
# against Postgres with pgvector), the web app (its generated client, lint,
# tests, the build with its first-screen size budget), known vulnerabilities
# in both, the compose file, then the end-to-end suite (web/e2e, `make e2e`)
# in a browser against the whole stack.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch replaces a run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    services:
      # The same Postgres as deploy/compose.yaml. The tests migrate it from
      # empty and create the vector extension themselves.
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: opennotebook
          POSTGRES_PASSWORD: opennotebook
          POSTGRES_DB: opennotebook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opennotebook -d opennotebook_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://opennotebook:opennotebook@localhost:5432/opennotebook_test
      # What the migration and contract checks connect to: the same database.
      DATABASE_URL: postgresql://opennotebook:opennotebook@localhost:5432/opennotebook_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      # Videos, as the server image has them (deploy/server.Dockerfile):
      # ffmpeg encodes them, skia loads libEGL and libGL to draw a
      # whiteboard, and a browser draws a deck's slides.
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libegl1 libgl1
      - name: Install
        run: uv sync --frozen && uv run playwright install --with-deps chromium
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run pyright
      # One migration head (two would leave a deploy guessing), and models
      # that match what the migrations build.
      - name: Migrations
        run: |
          heads=$(uv run alembic heads | wc -l)
          if [ "$heads" -ne 1 ]; then
            echo "There are $heads migration heads; add a merge revision."; uv run alembic heads; exit 1
          fi
          uv run alembic upgrade heads
          uv run alembic check
      # The web app's client is generated from this document, so a server
      # change that was not carried over fails here, not in a browser.
      - name: API contract
        run: |
          uv run opennotebook openapi > /tmp/openapi.json
          diff -u ../web/openapi.json /tmp/openapi.json || {
            echo "web/openapi.json is out of date: run make api-client and commit the result."; exit 1; }
      - name: Tests
        run: uv run pytest -q

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.9.1"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      # The committed client must be what the committed OpenAPI document
      # generates.
      - name: Generated client
        run: |
          pnpm exec openapi-ts
          git diff --exit-code -- src/client || {
            echo "src/client is out of date: run make api-client and commit the result."; exit 1; }
      - name: Lint
        run: pnpm lint
      - name: Tests
        run: pnpm test
      # Includes the type check and the first screen's size budget.
      - name: Build
        run: pnpm build

  # Known vulnerabilities in what the server and the web app ship with.
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.23"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.9.1"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
      - name: Server dependencies
        working-directory: server
        run: |
          uv export --frozen --no-dev --no-emit-project > /tmp/requirements.txt
          uvx pip-audit==2.10.1 -r /tmp/requirements.txt --disable-pip --progress-spinner off
      - name: Web dependencies
        working-directory: web
        run: pnpm audit --prod

  # The production stack's compose file reads as Docker reads it.
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compose file
        run: POSTGRES_PASSWORD=check docker compose -f deploy/compose.yaml config -q

  # The main path in a real browser: the api, the worker and the web app's dev
  # server against an empty Postgres, as `make dev` runs them. The suite asks
  # no model for anything; the AI endpoint points nowhere, so nothing can.
  e2e:
    runs-on: ubuntu-24.04
    needs: [server, web]
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: opennotebook
          POSTGRES_PASSWORD: opennotebook
          POSTGRES_DB: opennotebook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opennotebook -d opennotebook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://opennotebook:opennotebook@localhost:5432/opennotebook
      OPENNOTEBOOK_AI_BASE_URL: http://ai.invalid/v1
      # A provider set in the environment, so the studio skips its setup
      # tour. Nothing the suite does calls it.
      OPENNOTEBOOK_AI_KEY: e2e-unused
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.9.1"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: |
          (cd server && uv sync --frozen)
          (cd web && pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium)
      - name: Migrate
        working-directory: server
        run: uv run alembic upgrade heads
      - name: Start the studio
        run: |
          (cd server && nohup uv run opennotebook serve > ../api.log 2>&1 &)
          (cd server && nohup uv run opennotebook worker > ../worker.log 2>&1 &)
          (cd web && nohup pnpm dev > ../web.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://localhost:5173/api/ready > /dev/null && curl -sf http://localhost:5173/ui/ > /dev/null && exit 0
            sleep 2
          done
          echo "The studio did not start."; tail -50 api.log worker.log web.log; exit 1
      - name: End-to-end
        working-directory: web
        run: pnpm e2e
      - name: Logs
        if: failure()
        run: tail -100 api.log worker.log web.log
      - name: Traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: web/test-results/
          retention-days: 7

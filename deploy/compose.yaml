# OpenNotebook in production: Caddy in front, the api and the worker behind
# it, Postgres 18 with pgvector, and Speaches when the `speech` profile is on.
# Voices are Microsoft's by default and need no server here; Speaches turns
# spoken questions into text, and reads aloud too when
# OPENNOTEBOOK_TTS_PROVIDER is openai. docs/stack-migration-plan.md section 2
# draws it.
#
#   cp deploy/.env.example deploy/.env    # then fill it in
#   make up                               # builds the images here
#   docker compose -f deploy/compose.yaml pull && docker compose -f deploy/compose.yaml up -d --no-build
#                                         # or runs the published ones
#   docker compose -f deploy/compose.yaml --profile speech up -d   # with Speaches
#
# Every setting is in deploy/.env; .env.example says what each one does.

name: opennotebook

# What the api, the worker and the migrate step share: the one server image,
# the operator's settings, and where the database and the files are.
x-server: &server
  image: ghcr.io/mahmoud-emad/opennotebook-server:${OPENNOTEBOOK_VERSION:-latest}
  build:
    context: ..
    dockerfile: deploy/server.Dockerfile
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: ${DATABASE_URL:-postgresql://opennotebook:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/opennotebook}
    OPENNOTEBOOK_FILES_DIR: /data/files
    # The studio is served from one address, so the dev server's CORS origin
    # is the public one here.
    OPENNOTEBOOK_WEB_ORIGIN: ${PUBLIC_URL:-http://localhost}
    # Speaches, when the speech profile runs it. A value in .env wins.
    OPENNOTEBOOK_TTS_BASE_URL: ${OPENNOTEBOOK_TTS_BASE_URL:-http://speech:8000/v1}
  volumes:
    - files:/data/files

services:
  caddy:
    image: ghcr.io/mahmoud-emad/opennotebook-web:${OPENNOTEBOOK_VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      # The domain, or plain HTTP on :80 inside the container without one.
      SITE_ADDRESS: ${DOMAIN:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      # Certificates and their keys, kept across restarts.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *server
    command: ["opennotebook", "serve", "--host", "0.0.0.0", "--port", "8000"]
    # Two seconds for open connections, eight for running work, then the rest
    # of the clean-up (opennotebook/shutdown.py).
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *server
    command: ["opennotebook", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Brings the database up to the newest schema, then exits. The api and the
  # worker start only once it has succeeded.
  migrate:
    <<: *server
    restart: "no"
    command: ["alembic", "upgrade", "heads"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: opennotebook
      POSTGRES_DB: opennotebook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/18.
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opennotebook -d opennotebook"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Text to speech and speech to text, OpenAI-compatible. Off unless asked
  # for: `--profile speech`. The models download on first use into its volume.
  speech:
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu
    profiles: ["speech"]
    restart: unless-stopped
    volumes:
      - speech-models:/home/ubuntu/.cache/huggingface/hub

volumes:
  postgres:
  files:
  caddy-data:
  caddy-config:
  speech-models:

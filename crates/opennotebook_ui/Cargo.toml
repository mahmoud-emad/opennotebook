# opennotebook_ui — the end-user Dioxus/WASM app.
#
# Standalone workspace on purpose: a wasm crate cannot share a cargo target dir
# with the native server crates, so the repo root excludes this path and `dx`
# builds it. `cargo build --workspace` touches only the native crates.
#
# `make build-ui` runs install.sh, which builds with `dx build --platform web`
# and installs the bundle into the data directory's ui/, which the server
# serves at /ui/. Placement is publication; there is no deploy step.
[workspace]

[package]
name        = "opennotebook_ui"
version     = "0.1.0"
edition     = "2024"
description = "opennotebook end-user app: prepare a session, watch it build, play it."

[dependencies]
dioxus = { version = "0.7", features = ["web"] }

# The service's own generated client, as a path dep so it cannot drift from this
# checkout's oschema. Its socket transport is gated off for wasm32, so only the
# fetch constructors link here. This is the phase 1 rule: generated clients,
# never hand-written JSON-RPC.
opennotebook_sdk = { path = "../opennotebook_sdk" }

serde      = { version = "1", features = ["derive"] }
serde_json = "1"
# Markdown in the Studio's chat replies. No default features: the HTML writer
# and the parser only, no CLI or SIMD.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

# Browser globals: the mount prefix comes from location, and prep progress
# arrives on the same EventSource stream the player uses.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys       = "0.3"
web-sys      = { version = "0.3", features = [
    "Window", "Location", "Document", "EventSource", "MessageEvent", "EventTarget", "Event",
    # Selecting on home: Esc, Ctrl/Cmd-A and Delete, page-wide.
    "KeyboardEvent",
    # Routing: the screen is in the URL, so a refresh lands where you were.
    "History", "PopStateEvent",
    "Request", "RequestInit", "Response", "Headers", "Storage",
    "ReadableStream", "ReadableStreamDefaultReader",
    # The mind map: a pane's size to fit the map in, and a label's real width.
    "Element", "DomRect", "HtmlCanvasElement", "CanvasRenderingContext2d", "TextMetrics",
    # Files added as sources: picked, or dropped on the sources panel, and sent
    # as the request body.
    "File", "FileList", "Blob", "HtmlElement", "HtmlInputElement", "DragEvent", "DataTransfer",
] }

[profile.release]
# Strip DWARF: wasm-opt aborts on it, and the bundle is smaller without it.
strip = true

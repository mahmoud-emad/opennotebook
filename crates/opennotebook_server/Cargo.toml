[package]
name = "opennotebook_server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "OpenNotebook server: the JSON-RPC API, narration audio and slide HTML, and the web app, on one address"



[[bin]]
name = "opennotebook_server"
path = "src/main.rs"

[dependencies]
opennotebook_session = { path = "../opennotebook_session" }
# The studio's own voice detection. Same crate the page runs in its
# AudioWorklet, so the gate here and the gate there cannot disagree.
opennotebook_vad = { path = "../opennotebook_vad" }
opennotebook_ingest  = { path = "../opennotebook_ingest" }
opennotebook_script  = { path = "../opennotebook_script" }
opennotebook_build   = { path = "../opennotebook_build" }
# Uploaded PDF, Word, PowerPoint and Excel files become Markdown sources with
# the same converter ingest reads them with.
opennotebook_convert = { path = "../opennotebook_convert" }
# Its own generated client, for one thing only: the slide style table in
# `styles`, which the create page and this crate have to read from one place or
# they drift.
opennotebook_sdk     = { path = "../opennotebook_sdk" }

opennotebook_memory = { path = "../opennotebook_memory" }
# Transcribes the QUESTION, locally, so the listener can see what was heard.
# The answer does not go through it — see src/ask.rs.
opennotebook_speech = { path = "../opennotebook_speech" }

opennotebook_ai = { path = "../opennotebook_ai" }
# The five RPC domains: types, traits, dispatchers, generated from its oschema/.
opennotebook_api = { path = "../opennotebook_api" }
async-trait            = { workspace = true }
# The web app's static files.
tower-http = { version = "0.6", features = ["fs"] }

# A mind map's id: a UUID, so every map has its own address however many are
# made in the same millisecond.
uuid       = { version = "1", features = ["v4"] }
base64     = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
tokio      = { workspace = true }
axum         = { workspace = true, features = ["macros"] }
futures-util = { workspace = true }
tokio-stream = { workspace = true }
anyhow     = { workspace = true }
async-stream = { workspace = true }
# Reads the model price catalog (src/estimate_live.rs). The features match
# opennotebook_ai's so it compiles once.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

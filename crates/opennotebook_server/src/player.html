    dropEmptyTurn();
    appendMsg(bubble({
      who: "Studio", cls: "err",
      text: `That recording was ${secs.toFixed(1)}s of audio, too short to be a question. `
          + `Nothing was sent. Try holding the mic a moment longer.`,
    }));
    micButtons("idle"); micState(""); turnBusy = false; sending = false; buttons();
    await resumeNarration();
    return;
  }
  // One bubble, now, with whatever the browser heard. `heard` from the server
  // replaces it when it lands, because that is the text the answer was actually
  // grounded in.
  liveMsg = appendMsg(bubble({ who: "You", text: heardText || "\u2026", cls: "you" }));
  micState("thinking…");
  onAir(true, "THINKING");
  nowSpeaking("", false);

  // No canned "thanks" line any more: the answer itself opens with the
  // narrator thinking aloud about the question, generated from the session, and
  // that is spoken within a couple of seconds on the same queue as the rest.

  const wav = toWav(samples, micRate);
  const sink = makeSink();
  const answerCtrl = new AbortController();
  const answerVoice = { sink, ctrl: answerCtrl };
  voices.add(answerVoice);
  answerMsg = null;

  // Talking while the studio thinks or answers is interrupt_response: silence
  // it, cancel the answer, and give them the floor. Before any answer has
  // been heard they were simply not finished, so the new speech CONTINUES the
  // question instead of replacing it, and the model gets the whole thing.
  let barged = false;
  let holdMsg = null;        // the "one moment" bubble while the answer is prepared
  let answerHeard = false;   // any of the answer has actually played
  onBarge = () => {
    barged = true;
    const continuing = !answerHeard;
    hush();
    if (continuing) {
      captureFrom = questionFrom;
      if (liveMsg) { liveMsg.remove(); liveMsg = null; }
      if (ackMsg) { ackMsg.remove(); ackMsg = null; }
      if (answerMsg) { answerMsg.remove(); answerMsg = null; }
      if (holdMsg) { holdMsg.remove(); holdMsg = null; }
    } else {
      captureFrom = Math.max(0, speechAt - Math.round(micRate * PREFIX_MS / 1000));
    }
    speech = speechStart();
  };
  let said = "";
  let silent = null;   // the server's {input_ms, speech_ms, segment_count}
  let answerWho = "Studio";
  try {
    const c = resumeAfter ? flat[resumeAfter.i] : null;
    const qs = new URLSearchParams({
      session: SID,
      slide: String(c ? c.slide.ordinal : 0),
      line: c ? c.line.line_id : "",
      offset_ms: String(Math.round((audio.currentTime || 0) * 1000)),
    });
    const res = await fetch(`${API}/ask?${qs}`, {
      method: "POST", headers: { "Content-Type": "audio/wav" }, body: wav,
      signal: answerCtrl.signal,
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let cut;
      while ((cut = buf.indexOf("\n\n")) >= 0) {
        const frame = buf.slice(0, cut); buf = buf.slice(cut + 2);
        let ev = null; const data = [];
        for (const ln of frame.split("\n")) {
          if (ln.startsWith("event:")) ev = ln.slice(6).trim();
          // Only ONE space is consumed by the field, and the payload is JSON so
          // whitespace inside it survives regardless.
          else if (ln.startsWith("data:")) data.push(ln.slice(5).replace(/^ /, ""));
        }
        const payload = data.join("\n");
        if (ev === "hold") {
          // The narrator filling the wait ("let me look into that") while the
          // whole answer is prepared. One bubble per turn, showing the latest.
          if (barged) continue;
          if (!holdMsg) holdMsg = appendMsg(bubble({ who: answerWho, text: "", cls: "on" }));
          setText(holdMsg, JSON.parse(payload).t, false);
        } else if (ev === "hold_audio") {
          // Played on the same queue as the answer, so it can never overlap it,
          // but it is not the answer: talking over it still continues the
          // question rather than interrupting a reply.
          if (barged) continue;
          sink.push(b64ToPcm16(payload));
        } else if (ev === "audio") {
          if (barged) continue;
          answerHeard = true;
          if (!answerMsg) { micState(`${answerWho} is answering`); onAir(true, "ANSWERING"); nowSpeaking(answerWho, true); }
          sink.push(b64ToPcm16(payload));
        } else if (ev === "speaker") {
          // Who is about to answer. The bubble is created here, before any
          // audio, so the name is right from the first frame rather than
          // appearing as "Studio" and being corrected.
          answerWho = JSON.parse(payload).t || "Studio";
        } else if (ev === "said") {
          if (holdMsg) { holdMsg.classList.remove("on"); holdMsg = null; }
          said += JSON.parse(payload).t;
          if (!answerMsg) answerMsg = appendMsg(bubble({ who: answerWho, text: "", cls: "on" }));
          setText(answerMsg, said, true);
        } else if (ev === "heard") {
          // The authoritative transcript, from the same bytes the model got.
          if (liveMsg) setText(liveMsg, JSON.parse(payload).t, false);
        } else if (ev === "silent") {
          // The server found no speech in the clip. Phase 2 §8 says resume
          // silently, and this used to do exactly that: the bubbles were taken
          // back and NOTHING replaced them, so a listener who had just pressed
          // send watched their question disappear and reported the button as
          // broken. Silence is now said out loud, with the numbers.
          silent = JSON.parse(payload || "{}");
        } else if (ev === "heard_failed") {
          if (liveMsg) liveMsg.title = JSON.parse(payload).t;
        } else if (ev === "failed") {
          throw new Error(JSON.parse(payload).t);
        }
      }
    }
    if (silent) {
      dropEmptyTurn();
      const secs = ((silent.input_ms || 0) / 1000).toFixed(1);
      appendMsg(bubble({
        who: "Studio", cls: "err",
        text: `I could not hear any speech in that ${secs}s recording, so I did not answer it. `
            + `If you did speak, the microphone may be picking up the room instead of you.`,
      }));
      micState("");
    } else {
      if (answerMsg) setText(answerMsg, said, false);
      micState("");
      await new Promise((r) => {
        const t = setTimeout(r, Math.ceil(sink.endsIn() * 1000) + 150);
        answerCtrl.signal.addEventListener("abort", () => { clearTimeout(t); r(); });
      });
    }
  } catch (e) {
    if (barged) {
      // Not a failure: they cut in. The bubble keeps only what was said
      // before they did, the way a transcript of a real conversation would.
    } else {
    if (!answerMsg) dropEmptyTurn();
    appendMsg(bubble({ who: "Studio", text: `could not answer: ${e && e.message ? e.message : e}`, cls: "err" }));
    micState("");
    }
  } finally {
    onBarge = null;
    voices.delete(answerVoice);
    sink.stop(); sink.close();
    if (answerMsg) {
      if (barged) setText(answerMsg, said.trim() + " \u2014", false);
      answerMsg.classList.remove("on");
    }
    if (holdMsg) holdMsg.classList.remove("on");
    liveMsg = null; answerMsg = null; ackMsg = null;
    sending = false;
  }
  if (barged && !cancelled && micStream) {
    // Same turn, their floor again. The narration stays paused.
    heardSpeech = true;
    listen();
    return;
  }
  stopSpeech(); micStop();
  armed = false; micButtons("idle"); turnBusy = false; buttons();
  if (!cancelled) await resumeNarration();
}

// §5, decided: the interrupted line replays from its START, not from the offset.
// `cues[]` is empty and cue granularity is 11.6 s, so no millisecond in this
// stack maps to a word boundary and a seek lands mid-syllable.
async function resumeNarration() {
  const r = resumeAfter;
  resumeAfter = null;
  if (!r) return;
  // Nothing to go back to. Measured as a bug: after the deck finished, asking a
  // question replayed a line that had already been covered, because the resume
  // only ever looked at the index and never at whether there was still a session
  // running to return to.
  if (r.ended) { onAir(false, "ENDED"); nowSpeaking("", false); buttons(); return; }
  await startAt(r.i, 0);
}

$("ask").onclick = askStart;
$("send").onclick = () => askSend();
$("discard").onclick = askCancel;

// A video player's keys: K plays and pauses, the arrows move a slide, C is
// captions, F is full screen. Space stays the microphone, because asking is
// what this page is for.
addEventListener("keydown", (e) => {
  const tag = (e.target && e.target.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA" || e.ctrlKey || e.metaKey || e.altKey) return;
  if ($("confirm").classList.contains("show")) return;
  const k = e.key.toLowerCase();
  if (k === "k") { e.preventDefault(); if (!$("playpause").disabled) $("playpause").onclick(); }
  else if (e.key === "ArrowLeft") { if (!$("prev").disabled) { e.preventDefault(); stepSlide(-1); } }
  else if (e.key === "ArrowRight") { if (!$("next").disabled) { e.preventDefault(); stepSlide(1); } }
  else if (k === "c") { toggleCaptions(); }
  else if (k === "f") { toggleFullscreen(); }
});

// Space is the shortcut, not the mechanism: press to open the mic, press again
// to send. Hold-to-talk was the first shape and it makes a long question mean
// holding a key for a long time, which is the thing the Send button removes.
addEventListener("keydown", (e) => {
  if (e.code !== "Space" || e.repeat) return;
  const tag = (e.target && e.target.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  e.preventDefault();
  if (!turnBusy) { if (!$("ask").disabled) askStart(); }
  else if (micStream) askCancel();
});

// ── leaving ──────────────────────────────────────────────────────────────────
// Home is the collection this session was made in, on the studio's own page,
// which is a sibling of this route rather than a path this page can assume:
// the service root is whatever precedes /api. With no collection known (the
// session could not be read) it is the studio's home.
function homeUrl() {
  const ui = API.replace(/\/api\/session$/, "") + "/ui/";
  return COLLECTION ? ui + "c/" + encodeURIComponent(COLLECTION) : ui;
}

$("leave").onclick = () => {
  const c = cur();
  // Only ask when there is a place to lose: before the first line and after
  // the last there is nothing to warn about, so the mark just goes home.
  if (!c || idx < 0 || ended) { $("do-leave").onclick(); return; }
  $("confirm-why").textContent = c && !ended
    ? `You are on slide ${c.slide.ordinal + 1} of ${slides().length}. Your place is not kept, so coming back starts from the beginning.`
    : "Your place is not kept, so coming back starts from the beginning.";
  $("confirm").classList.add("show");
};
$("stay").onclick = () => $("confirm").classList.remove("show");
$("do-leave").onclick = async () => {
  playing = false;
  audio.pause();
  try { es.close(); } catch (e) {}
  // Tell the studio the session stopped rather than just walking away: it owns
  // the playhead and nothing else would ever tell it.
  await rpc("playback_pause", { req: at() }).catch(() => {});
  location.href = homeUrl();
};
addEventListener("keydown", (e) => {
  if (e.key === "Escape" && $("confirm").classList.contains("show")) $("stay").onclick();
});

// ── event stream ─────────────────────────────────────────────────────────────
const es = new EventSource(`${API}/events?session=${encodeURIComponent(SID)}`);

es.addEventListener("session.state", async (e) => {
  const st = JSON.parse(e.data).state;
  $("state").textContent = st;
  $("state").dataset.s = st;
  if (st === "ready" && !session) {
    await loadSession();
    $("prep").hidden = true;
    const c = flat[0];
    if (c) { fit(c.slide.aspect); showSlide(c.slide); }
    buttons();
  }
  if (st === "failed") {
    $("prep").hidden = false;
    $("stage-name").textContent = "prep failed";
    $("prep-sub").textContent = "check the job list";
    // A sweeping bar on a dead job is the page claiming work is happening.
    $("bar").classList.remove("idle");
    $("fill").style.width = "0%";
    onAir(false, "FAILED");
  }
});

// The six phases the pipeline actually runs, in order, so the card can say
// "3 of 6 · narrate" rather than a bare step name a viewer cannot place.
const PHASE_LABEL = {
  ingest:   "reading your resources",
  script:   "writing the script",
  deck:     "building the slides",
  measure:  "measuring the narration",
  narrate:  "recording the voices",
  validate: "checking it renders",
};

es.addEventListener("prep.progress", (e) => {
  const p = JSON.parse(e.data);
  $("stage-name").textContent = PHASE_LABEL[p.step] || p.step || "starting";
  // steps_total 0 is the job runner's own "this job does not report", not "no
  // phases". A 0% bar there would be a claim; the sweep is the absence of one.
  const known = p.steps_total > 0;
  $("bar").classList.toggle("idle", !known);
  $("prep-sub").textContent = known ? `step ${p.steps_done} of ${p.steps_total}` : "";
  $("fill").style.width = known
    ? (100 * p.steps_done) / p.steps_total + "%"
    : "";
});

// The remaining three are the studio telling the page what it is doing. The page
// already advances itself from the audio element, so these drive the display
// rather than the audio — the studio stays the thing that knows the position.
es.addEventListener("slide.enter", (e) => {
  const d = JSON.parse(e.data);
  const s = session && session.slides.find((x) => x.ordinal === d.slide_ordinal);
  if (s) showSlide(s);
});
es.addEventListener("line.start", (e) => {
  const d = JSON.parse(e.data);
  nowSpeaking(speakerName(d.speaker_id), true);
  onAir(true, "LIVE");
  $("state").textContent = "";
});
es.addEventListener("line.end", () => {});
es.addEventListener("playhead", () => {});

// First paint: a session that is already ready should not wait a poll interval.
(async () => {
  const s = await loadSession();
  if (s && s.state === "ready") {
    $("state").textContent = "ready";
    $("state").dataset.s = "ready";
    $("prep").hidden = true;
    if (flat[0]) { fit(flat[0].slide.aspect); showSlide(flat[0].slide); }
    buttons();
  } else if (s) {
    $("state").textContent = s.state;
    $("state").dataset.s = s.state;
    $("stage-name").textContent =
      s.state === "preparing" ? "preparing this session" : s.state;
  } else {
    $("state").textContent = "";
    $("stage-name").textContent = "no such session";
    $("prep-sub").textContent = SID;
    $("bar").classList.remove("idle");
  }
})();
</script>

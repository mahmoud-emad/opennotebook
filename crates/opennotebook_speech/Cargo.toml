[package]
name = "opennotebook_speech"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Text to speech and speech to text over OpenAI-compatible audio endpoints: Speaches, Kokoro-FastAPI, OpenAI."

[dependencies]
# Settings (base URLs, models, key) are read like every other setting.
opennotebook_session = { path = "../opennotebook_session" }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
axum = { workspace = true, features = ["multipart"] }
tokio = { workspace = true }

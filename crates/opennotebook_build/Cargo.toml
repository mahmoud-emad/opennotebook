[package]
name = "opennotebook_build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Builds the deck and the audio a generated script describes, and records the result."

[dependencies]
# Job rows live in the shared SQLite database.
rusqlite = { workspace = true }
# Whether a prep child is alive, and stopping it.
libc = { workspace = true }
opennotebook_session = { path = "../opennotebook_session" }
opennotebook_ai = { path = "../opennotebook_ai" }
# For `budget::speakable`: the spoken-text rules live with the other spoken-text
# budgets rather than being written twice.
opennotebook_script  = { path = "../opennotebook_script" }
opennotebook_speech = { path = "../opennotebook_speech" }
thiserror = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }

[dev-dependencies]
opennotebook_sdk = { path = "../opennotebook_sdk" }
tokio = { workspace = true }

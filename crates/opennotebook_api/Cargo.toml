[package]
name = "opennotebook_api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "The OpenNotebook JSON-RPC API: types, server traits and dispatchers, and clients, generated from oschema/ at build time."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }

# The client's transport: the browser's fetch on wasm32, reqwest natively.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Request", "RequestInit", "Response", "Headers"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[build-dependencies]
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

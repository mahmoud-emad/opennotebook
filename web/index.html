<!doctype html>
<html>
  <head>
    <title>OpenNotebook</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The viewer's theme, before the first paint, so the page never flashes the other theme. -->
    <script>try{if(localStorage.getItem("opennotebook.theme")==="light")document.documentElement.setAttribute("data-bs-theme","light")}catch(e){}</script>
    <style>
      html { background: #16181d; }
      html[data-bs-theme="light"] { background: #fafafb; }
    </style>
  </head>
  <body>
    <div id="main"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
